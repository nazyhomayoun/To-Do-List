version: '3.8' 
services:
  postgres:
    image: postgres:15
    container_name: todolist_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234          
      POSTGRES_DB: todolist_db  
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    command: python -m app.cli.main
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - postgres

volumes:
  postgres_data:
